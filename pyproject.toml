[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "acef"
version = "0.1.0"
description = "ACEF (AI Compliance Evidence Format) — Reference SDK"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [
    {name = "AI Commons", email = "acef@aicommons.org"},
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "pydantic>=2.6,<3.0",
    "rfc8785>=0.1.2,<1.0",
    "jsonschema[format]>=4.21,<5.0",
    "jsonpointer>=3.0,<4.0",
    "click>=8.1,<9.0",
    "rich>=13.0,<14.0",
    "cryptography>=42.0,<45.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-timeout>=2.3",
    "hypothesis>=6.100",
    "mypy>=1.8",
    "ruff>=0.3",
]

[project.scripts]
acef = "acef.cli.main:cli"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
# Authoritative tier marker registry owned by F-M1-TIER-INFRA (VAL-TIER-002).
#
# Tier model (per brief §plumbing-tier and ACEF v0.4 plan.md):
#   plumbing       = top-level fast tier; full plumbing tier MUST complete <=60s
#                    wall-clock. Composed of three sub-tiers below.
#   conformance    = sub-tier of plumbing; bundle-validation tests under
#                    tests/conformance/. Wall-clock budget <=40s.
#   regression     = sub-tier of plumbing; VAL-REGRESSION-* gate tests guarding
#                    v1.0-bundle byte-stability. Wall-clock budget <=20s.
#   integration    = top-level tier (NOT under plumbing); multi-component
#                    end-to-end tests under tests/integration/. Slower but
#                    bounded; not part of the <=60s plumbing budget.
#   legacy_budget  = VAL-REGRESSION-LEGACY-BUDGET-001 runtime-budget check.
#
# Tier markers are auto-applied to tests by location via the
# pytest_collection_modifyitems hook in tests/conftest.py. Tests MAY also be
# decorated explicitly; explicit decorators always take precedence.
markers = [
    "plumbing: Plumbing tier — top-level fast tier; full plumbing tier MUST complete <=60s wall-clock (VAL-TIER-003).",
    "integration: Integration tier — multi-component end-to-end tests under tests/integration/; not part of plumbing budget.",
    "conformance: Conformance sub-tier of plumbing — bundle-validation tests under tests/conformance/; wall-clock budget <=40s (VAL-TIER-003).",
    "regression: Regression sub-tier of plumbing — VAL-REGRESSION-* v1.0 byte-stability gates; wall-clock budget <=20s (VAL-TIER-003).",
    "legacy_budget: VAL-REGRESSION-LEGACY-BUDGET-001 runtime-budget check.",
]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.hatch.build.targets.wheel]
packages = ["src/acef"]
